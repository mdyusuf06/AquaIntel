name: aquaintel
description: "AquaIntel — AI-Powered Sonar Debris Detection"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  fl_chart: ^1.1.0
  flutter_map: ^8.3.2
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  latlong2: ^0.10.1
  provider: ^6.1.5+1

  # Network
  http: ^1.2.0
  dio: ^5.7.0

  # Location
  geolocator: ^13.0.2

  # Config
  flutter_dotenv: ^5.2.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  file_picker: ^11.0.3
  permission_handler: ^13.0.1
  webview_windows: ^0.4.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/3d_viewer.html
