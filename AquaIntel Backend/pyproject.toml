[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar_pipeline"
version = "0.1.0"
description = "AquaIntel Part 1: Physics-Based Ingestion, Preprocessing & Physics Feature Engine for Side-Scan Sonar"
authors = [
    { name = "Team Brainwave", email = "brainwave@aquaintel.ai" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.0.0",
    "rasterio>=1.3.0",
    "pyproj>=3.5.0",
    "scikit-image>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sonar_pipeline*"]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Windows"
venvPath = "."
venv = "venv"
extraPaths = [".", "sonar_pipeline"]
ignore = ["venv/**", "everthing/**"]
reportMissingModuleSource = "none"
reportMissingImports = "warning"

